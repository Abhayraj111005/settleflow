databaseChangeLog:

  - changeSet:
      id: 003-create-ledger-entries-table
      author: settleflow

      changes:
        - createTable:
            tableName: ledger_entries
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: transaction_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: DECIMAL(19,4)
                  constraints:
                    nullable: false

              - column:
                  name: entry_type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
