databaseChangeLog:

  - changeSet:
      id: 009-add-ledger-entry-constraints
      author: settleflow

      changes:

        - sql:
            sql: >
              ALTER TABLE ledger_entries
              ADD CONSTRAINT chk_ledger_entry_amount_positive
              CHECK (amount > 0);

        - sql:
            sql: >
              ALTER TABLE ledger_entries
              ADD CONSTRAINT chk_ledger_entry_type
              CHECK (entry_type IN ('DEBIT', 'CREDIT'));
