databaseChangeLog:
  - changeSet:
      id: 008-create-processed-events-table
      author: settleflow
      changes:
        - createTable:
            tableName: processed_events
            columns:
              - column:
                  name: event_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: processed_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false